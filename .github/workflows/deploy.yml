# Trigger auto-deploy after private key fix
name: CI/CD Pipeline for NexToolX

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Tải code từ GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Đóng gói mã nguồn React
      - name: Install Dependencies & Build Apps
        run: |
          npm install
          npm --prefix frontend install
          npm --prefix admin install
          npm run build:all

      # 4. Khởi tạo khóa SSH Key trên máy ảo GitHub
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 84.75.144.17 >> ~/.ssh/known_hosts

      # 5. Tải file đồng bộ lên VPS bằng rsync
      - name: Upload Files to VPS
        run: |
          # Đồng bộ Frontend
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519" --delete frontend/dist/ root@84.75.144.17:/var/www/nextoolx/frontend/dist
          
          # Đồng bộ Admin CRM
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519" --delete admin/dist/ root@84.75.144.17:/var/www/nextoolx/admin/dist
          
          # Đồng bộ Backend (chừa node_modules và db)
          rsync -avz -e "ssh -i ~/.ssh/id_ed25519" --exclude 'node_modules' --exclude 'database.sqlite' backend/ root@84.75.144.17:/var/www/nextoolx/backend

      # 6. Khởi động lại Backend PM2 trên VPS
      - name: Restart Backend PM2 on VPS
        run: |
          ssh -i ~/.ssh/id_ed25519 root@84.75.144.17 "cd /var/www/nextoolx/backend && npm install --production && pm2 restart nextoolx-backend || pm2 start index.js --name 'nextoolx-backend'"
